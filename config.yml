zipFormat: eaf
source: LiquidGlass/src
buildNameUncompiled: "LiquidGlass-{version}"
buildNameCompiled: "LiquidGlass-{version}"
ignoreAll:
  - LiquidGlass/.mandochka/cache/*
compilationIgnore: []
obfuscationConfig:
  stripDocstrings: true
  removeLogs: false
  renameLocals: false
dex:
  enabled: true
  source: dex_src
  stubs: compile_stubs
  output: LiquidGlass/res/dex/classes.dex
  minApi: 26
  targetJava: 8
